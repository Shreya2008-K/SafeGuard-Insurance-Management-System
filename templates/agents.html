{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <div><h1>Agents</h1><p class="muted">Manage insurance agents, commission rates and status.</p></div>
  <button class="btn btn-primary" id="addBtn" type="button">+ Add Agent</button>
</div>
<article class="card">
  <div class="toolbar">
    <input type="search" id="q" class="input" placeholder="Search by ID, name, email or phone" aria-label="Search agents">
    <select id="statusFilter" class="input" aria-label="Filter by status"><option value="">All statuses</option><option>Active</option><option>Inactive</option></select>
    <span class="muted" id="resultInfo"></span>
  </div>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>ID</th><th>Agent Name</th><th>Phone</th><th>Email</th><th class="num">Commission</th><th>Policies</th><th>Status</th><th class="actions">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</article>

<div class="modal-backdrop" id="formModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <form id="agentForm" novalidate>
      <div class="modal-head"><h3 id="formTitle">Add Agent</h3><button type="button" class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <div class="modal-body form-grid">
        <input type="hidden" name="agent_id">
        <div class="field span-2"><label for="agent_name">Agent name</label><input id="agent_name" name="agent_name" required maxlength="100"></div>
        <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="120"></div>
        <div class="field"><label for="commission_percentage">Commission (%)</label><input id="commission_percentage" name="commission_percentage" type="number" min="0" max="50" step="0.1" required></div>
        <div class="field"><label for="status">Status</label><select id="status" name="status"><option>Active</option><option>Inactive</option></select></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" type="submit" id="saveBtn">Save agent</button></div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/agents.js') }}"></script>{% endblock %}
