{% extends 'base.html' %}
{% block content %}
<div class="page-head">
  <div><h1>Customers</h1><p class="muted">Manage customer records and view their policies.</p></div>
  <button class="btn btn-primary" id="addBtn" type="button">+ Add Customer</button>
</div>
<article class="card">
  <div class="toolbar">
    <input type="search" id="q" class="input" placeholder="Search by ID, name, email or phone" aria-label="Search customers">
    <span class="muted" id="resultInfo"></span>
  </div>
  <div class="table-wrap">
    <table class="table">
      <thead><tr><th>ID</th><th>Full Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Email</th><th>Address</th><th>Created</th><th>Policies</th><th class="actions">Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pager" id="pager"></div>
</article>

<div class="modal-backdrop" id="formModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <form id="customerForm" novalidate>
      <div class="modal-head"><h3 id="formTitle">Add Customer</h3><button type="button" class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <div class="modal-body form-grid">
        <input type="hidden" name="customer_id">
        <div class="field span-2"><label for="full_name">Full name</label><input id="full_name" name="full_name" required maxlength="100"></div>
        <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" min="18" max="100" required></div>
        <div class="field"><label for="gender">Gender</label>
          <select id="gender" name="gender" required><option value="">Select…</option><option>Male</option><option>Female</option><option>Other</option></select></div>
        <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" required placeholder="e.g. 9840012345"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="120"></div>
        <div class="field span-2"><label for="address">Address <span class="opt">(optional)</span></label><textarea id="address" name="address" rows="2" maxlength="255"></textarea></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-outline" data-close>Cancel</button><button class="btn btn-primary" type="submit" id="saveBtn">Save customer</button></div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/customers.js') }}"></script>{% endblock %}
